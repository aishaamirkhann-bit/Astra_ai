name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astra-backend
    env:
      APP_ENV: test
      SECRET_KEY: ci-only-secret-key-not-for-production
      DATABASE_URL: sqlite:///./ci.db
      ASTRA_DB_PATH: ${{ runner.temp }}/astra-backend-products.db
      REFRESH_PRODUCTS_ON_STARTUP: "false"
      MARKET_FEED_ENABLED: "false"
      OTP_DEBUG_LOG: "true"
      REDIS_URL: ""
      STRIPE_SECRET_KEY: ""
      STRIPE_WEBHOOK_SECRET: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: astra-backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Seed demo data
        run: python -m app.db.seed

      - name: Run backend tests
        run: python -m pytest -q -p no:cacheprovider

  frontend:
    name: Frontend type-check & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

  e2e:
    name: Browser E2E (Playwright)
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      SECRET_KEY: ci-only-secret-key-not-for-production
      DATABASE_URL: sqlite:///./ci.db
      ASTRA_DB_PATH: ${{ runner.temp }}/astra-e2e-products.db
      REFRESH_PRODUCTS_ON_STARTUP: "false"
      MARKET_FEED_ENABLED: "false"
      OTP_DEBUG_LOG: "true"
      REDIS_URL: ""
      STRIPE_SECRET_KEY: ""
      STRIPE_WEBHOOK_SECRET: ""
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_TELEMETRY_DISABLED: "1"
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: astra-backend/requirements.txt

      - name: Install backend dependencies
        working-directory: astra-backend
        run: python -m pip install -r requirements.txt

      - name: Seed demo data
        working-directory: astra-backend
        run: python -m app.db.seed

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.playwright-browsers
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser and OS dependencies
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite
        run: npm run test:e2e

  docker:
    name: Production Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Docker Compose environment
        run: cp .env.production.example .env.production

      - name: Validate production Compose configuration
        run: docker compose --env-file .env.production -f docker-compose.prod.yml config --quiet

      - name: Build production images
        run: docker compose --env-file .env.production -f docker-compose.prod.yml build
