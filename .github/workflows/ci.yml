name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  backend:
    name: Backend tests (SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astra-backend
    env:
      REFRESH_PRODUCTS_ON_STARTUP: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: astra-backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Seed demo data
        run: python -m app.db.seed

      - name: Run pytest
        run: python -m pytest tests/ -q -p no:cacheprovider

  frontend:
    name: Frontend type-check & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

  e2e:
    name: Browser E2E (Playwright)
    runs-on: ubuntu-latest
    env:
      REFRESH_PRODUCTS_ON_STARTUP: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: astra-backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r astra-backend/requirements.txt

      - name: Seed demo data
        working-directory: astra-backend
        run: python -m app.db.seed

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers

      - name: Run E2E suite
        run: npx playwright test

  docker:
    name: Production Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare env file
        run: cp .env.production.example .env.production

      - name: Build production images
        run: docker compose -f docker-compose.prod.yml build
