[pytest]
; Isolated cosmetic config: keep test output clean without touching business logic.
; - no:cacheprovider avoids PytestCacheWarning on ACL-locked .pytest_cache dirs (Windows).
; - python-jose (unmaintained) calls datetime.utcnow() internally; ignore only that
;   third-party DeprecationWarning. ASTRA code itself is utcnow-free.
addopts = -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning:jose
